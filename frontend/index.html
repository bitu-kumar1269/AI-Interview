<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/AI-interview-svg-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/AI-interview-svg-icon.svg" />
    <link rel="apple-touch-icon" href="/AI-interview-svg-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Interview Prep — Practice interviews with AI-generated questions tailored to your resume and target role." />
    <meta name="theme-color" content="#6366f1" />
    <title>AI Interview Prep | Ace Your Next Interview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var adminSaved = localStorage.getItem('admin-dark-mode');
          var isLight = saved === 'light' || (adminSaved && JSON.parse(adminSaved) === false);
          if (isLight) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
