name: CI

on:
  pull_request:
    branches: [main]

  workflow_call: {}

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: /api

  docker-build-check:
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_API_URL=/api

  terraform-validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: devops/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  ansible-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          check-latest: true

      - name: Create Ansible virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install ansible ansible-lint

      - name: Verify Ansible Python version
        run: |
          "$RUNNER_TEMP/ansible-venv/bin/python" --version
          "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" --version
          "$RUNNER_TEMP/ansible-venv/bin/ansible-lint" --version

      - name: Check Ansible syntax
        working-directory: devops
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/devops/ansible/roles
        run: |
          "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" \
            -i ansible/inventory/hosts.ini.example \
            ansible/playbooks/site.yml \
            --syntax-check

      - name: Run Ansible lint
        working-directory: devops
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/devops/ansible/roles
        run: |
          "$RUNNER_TEMP/ansible-venv/bin/ansible-lint" \
            ansible/playbooks/site.yml