name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual re-run from the Actions tab

permissions:
  id-token: write # required for AWS OIDC
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a deploy midway (could corrupt state)

env:
  AWS_REGION: ap-south-1
  TF_LOCK_TABLE: ai-interviewer-tf-lock
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-interviewer-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-interviewer-frontend

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push images to GHCR
    outputs:
      backend_tag: ${{ steps.tags.outputs.backend_tag }}
      frontend_tag: ${{ steps.tags.outputs.frontend_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags (git SHA, NOT latest)
        id: tags
        run: |
          echo "backend_tag=${{ env.BACKEND_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.tags.outputs.backend_tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build + push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ steps.tags.outputs.frontend_tag }}
            ${{ env.FRONTEND_IMAGE }}:latest

  terraform:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write # AWS OIDC
    environment: production # requires manual approval if you configure
    # a GitHub Environment protection rule named "production"
    outputs:
      ec2_ip: ${{ steps.outputs.outputs.ec2_ip }}
      sg_id: ${{ steps.outputs.outputs.sg_id }}

    defaults:
      run:
        working-directory: devops/terraform
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          # role-to-assume: arn:aws:iam::700922282359:role/github-actions-ai-interviewer
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (S3 remote state)
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=ai-interviewer/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
        # Remote state is required here: with local state, every run would
        # start empty and try to create duplicate infrastructure. Bootstrap
        # the bucket once via terraform/bootstrap (see README.md).

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -var="key_name=${{ secrets.EC2_KEY_PAIR_NAME }}" \
            -var="admin_cidr=${{ secrets.ALLOWED_SSH_CIDR }}" \
            -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
        # NOTE: auto-approve here is gated by the "production" GitHub
        # Environment above, which you should configure with required
        # reviewers in repo Settings > Environments. Never add a
        # `terraform destroy` step to this workflow.

      - name: Capture outputs
        id: outputs
        working-directory: devops/terraform
        run: |
          set -euo pipefail
          echo "ec2_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          echo "sg_id=$(terraform output -raw security_group_id)" >> "$GITHUB_OUTPUT"

  ansible-deploy:
    runs-on: ubuntu-latest
    environment: production
    needs: [build-and-push, terraform]
    permissions:
      contents: read
      id-token: write # AWS OIDC (security group rule for the runner IP)
      packages: read # token is passed to the server for `docker pull`
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible + Docker collection
        run: |
          pip install ansible
          ansible-galaxy collection install -r devops/ansible/requirements.yml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          # role-to-assume: arn:aws:iam::700922282359:role/github-actions-ai-interviewer
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      # SSH is not open to the world and the runner's IP changes every run,
      # so open port 22 for this runner's IP only, and always close it after.
      - name: Temporarily allow this runner's IP on port 22
        id: sg
        run: |
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com | tr -d '\n')"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ needs.terraform.outputs.sg_id }}" \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32"
          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"

      - name: Write SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key.pem

          chmod 600 ~/.ssh/deploy_key.pem

          ssh-keygen -y -f ~/.ssh/deploy_key.pem > /dev/null

          echo "SSH private key validated successfully"

      # - name: Write dynamic inventory
      #   run: |
      #     mkdir -p devops/ansible/inventory
      #     cat > devops/ansible/inventory/hosts.ini <<EOF
      #     [monitoring]
      #     monitor-host ansible_host=${{ needs.terraform.outputs.ec2_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/deploy_key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
      #     EOF

      
      # Create Ansible inventory in the correct location
      - name: Write dynamic inventory
        run: |
          mkdir -p devops/ansible/inventory
          cat > devops/ansible/inventory/hosts.ini <<EOF
          [monitoring]
          monitor-host ansible_host=${{ needs.terraform.outputs.ec2_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/deploy_key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
          EOF

      # Write CI secrets into Ansible group variables
      - name: Write group_vars from GitHub Secrets
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_tag }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_tag }}

          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

          CLIENT_URL: http://${{ needs.terraform.outputs.ec2_ip }}:8081
          BACKEND_URL: http://${{ needs.terraform.outputs.ec2_ip }}:8081

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: http://${{ needs.terraform.outputs.ec2_ip }}:8081/api/auth/google/callback

          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}

          NAGIOS_ADMIN_PASSWORD: ${{ secrets.NAGIOS_ADMIN_PASSWORD }}

        run: |
          mkdir -p devops/ansible/inventory/group_vars/all

          python - <<'PY'
          import json
          import os

          variables = {
              "registry_username": "REGISTRY_USERNAME",
              "registry_password": "REGISTRY_PASSWORD",
              "registry_url": None,
              "backend_image": "BACKEND_IMAGE",
              "frontend_image": "FRONTEND_IMAGE",
              "mongo_uri": "MONGO_URI",
              "jwt_secret": "JWT_SECRET",
              "jwt_refresh_secret": "JWT_REFRESH_SECRET",
              "groq_api_key": "GROQ_API_KEY",
              "openai_api_key": "OPENAI_API_KEY",
              "cloudinary_cloud_name": "CLOUDINARY_CLOUD_NAME",
              "cloudinary_api_key": "CLOUDINARY_API_KEY",
              "cloudinary_api_secret": "CLOUDINARY_API_SECRET",
              "client_url": "CLIENT_URL",
              "backend_url": "BACKEND_URL",
              "google_client_id": "GOOGLE_CLIENT_ID",
              "google_client_secret": "GOOGLE_CLIENT_SECRET",
              "google_callback_url": "GOOGLE_CALLBACK_URL",
              "adzuna_app_id": "ADZUNA_APP_ID",
              "adzuna_app_key": "ADZUNA_APP_KEY",
              "vault_nagios_admin_password": "NAGIOS_ADMIN_PASSWORD",
          }

          data = {
              key: ("ghcr.io" if env_name is None else os.environ.get(env_name, ""))
              for key, env_name in variables.items()
          }

          with open(
              "devops/ansible/inventory/group_vars/all/99-ci.json",
              "w"
          ) as file:
              json.dump(data, file, indent=2)
          PY

      - name: Verify Nagios password was written
        run: |
          python - <<'PY'
          import json

          path = "devops/ansible/inventory/group_vars/all/99-ci.json"

          with open(path) as f:
              data = json.load(f)

          password = data.get("vault_nagios_admin_password", "")

          if not password:
              raise SystemExit("ERROR: Nagios password is empty!")

          print("SUCCESS: Nagios password is present.")
          PY

      # Run Ansible deployment
      - name: Run Ansible playbook
        run: |
          cd devops/ansible
          export ANSIBLE_CONFIG="$PWD/ansible.cfg"
          ansible-playbook -i inventory/hosts.ini playbooks/site.yml

      # Check backend health (single check)
      - name: Check Backend Health
        run: |
          BACKEND_URL="http://${{ needs.terraform.outputs.ec2_ip }}:8081"

          echo "Checking: ${BACKEND_URL}/api/health"

          curl --fail --retry 5 --retry-delay 5 \
            "${BACKEND_URL}/api/health"

      # Always revoke the temporary SSH access
      - name: Revoke runner IP from port 22
        if: always() && steps.sg.outputs.runner_ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ needs.terraform.outputs.sg_id }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.sg.outputs.runner_ip }}/32"

      # Always remove temporary credentials and secrets
      - name: Clean up local secrets files
        if: always()
        run: |
          rm -f devops/ansible/inventory/group_vars/all/99-ci.json
          rm -f ~/.ssh/deploy_key.pem
