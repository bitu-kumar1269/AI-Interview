name: Deploy to AWS

on:
  push:
    branches:
      - main

  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_LOCK_TABLE: ai-interviewer-tf-lock

  REGISTRY: ghcr.io

  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-interviewer-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-interviewer-frontend

jobs:

  # ============================================================
  # CI
  # ============================================================

  ci:
    name: Run CI
    uses: ./.github/workflows/ci.yml


  # ============================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ============================================================

  build-and-push:
    name: Build and Push Docker Images

    needs:
      - ci

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      backend_tag: ${{ steps.tags.outputs.backend_tag }}
      frontend_tag: ${{ steps.tags.outputs.frontend_tag }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Docker image tags
        id: tags
        run: |
          echo "backend_tag=${BACKEND_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=${FRONTEND_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.tags.outputs.backend_tag }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ steps.tags.outputs.frontend_tag }}
            ${{ env.FRONTEND_IMAGE }}:latest


  # ============================================================
  # TERRAFORM
  # ============================================================

  terraform:
    name: Terraform Infrastructure

    needs:
      - build-and-push

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment: production

    defaults:
      run:
        working-directory: devops/terraform

    outputs:
      ec2_ip: ${{ steps.outputs.outputs.ec2_ip }}
      sg_id: ${{ steps.outputs.outputs.sg_id }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Verify AWS authentication
        run: |
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=ai-interviewer/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -var="ssh_key_name=${{ secrets.EC2_KEY_PAIR_NAME }}" \
            -var="admin_cidr=${{ secrets.ALLOWED_SSH_CIDR }}" \
            -out=tfplan

      - name: Terraform apply
        run: |
          terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        id: outputs
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> "$GITHUB_OUTPUT"
          echo "sg_id=$(terraform output -raw security_group_id)" >> "$GITHUB_OUTPUT"

      - name: Display deployment target
        run: |
          echo "EC2 IP: ${{ steps.outputs.outputs.ec2_ip }}"
          echo "Security Group: ${{ steps.outputs.outputs.sg_id }}"


  # ============================================================
  # ANSIBLE DEPLOYMENT
  # ============================================================

  ansible-deploy:
    name: Deploy Application with Ansible

    needs:
      - build-and-push
      - terraform

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify Python
        run: |
          python --version
          which python

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible

      - name: Verify Ansible
        run: |
          python --version
          which python
          which ansible-playbook
          python -m ansible --version

      # --------------------------------------------------------
      # AWS OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Verify AWS authentication
        run: |
          aws sts get-caller-identity

      # --------------------------------------------------------
      # Get GitHub runner public IP
      # --------------------------------------------------------

      - name: Get GitHub runner public IP
        id: runner-ip
        run: |
          RUNNER_IP="$(curl -fsSL https://checkip.amazonaws.com | tr -d '\n')"

          echo "Runner IP: ${RUNNER_IP}"

          echo "runner_ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Temporarily allow SSH from GitHub runner
      # --------------------------------------------------------

      - name: Allow runner IP on SSH
        id: sg
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ needs.terraform.outputs.sg_id }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.runner_ip }}/32"

      # --------------------------------------------------------
      # SSH private key
      # --------------------------------------------------------

      - name: Create SSH private key
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' \
            "${{ secrets.EC2_SSH_PRIVATE_KEY }}" \
            > ~/.ssh/deploy_key.pem

          chmod 600 ~/.ssh/deploy_key.pem

      # --------------------------------------------------------
      # Dynamic Ansible inventory
      # --------------------------------------------------------

      - name: Create Ansible inventory
        run: |
          mkdir -p devops/ansible/inventory

          cat > devops/ansible/inventory/hosts.ini <<EOF
          [app_servers]
          app1 ansible_host=${{ needs.terraform.outputs.ec2_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/deploy_key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
          EOF

          cat devops/ansible/inventory/hosts.ini

      # --------------------------------------------------------
      # Create temporary Ansible variables
      # --------------------------------------------------------

      - name: Create Ansible deployment variables
        run: |
          mkdir -p devops/ansible/inventory/group_vars/all

          cat > devops/ansible/inventory/group_vars/all/ci.yml <<EOF
          registry_username: "${{ github.actor }}"
          registry_password: "${{ secrets.GITHUB_TOKEN }}"
          registry_url: "ghcr.io"

          backend_image: "${{ needs.build-and-push.outputs.backend_tag }}"
          frontend_image: "${{ needs.build-and-push.outputs.frontend_tag }}"

          mongo_uri: "${{ secrets.MONGO_URI }}"
          jwt_secret: "${{ secrets.JWT_SECRET }}"
          jwt_refresh_secret: "${{ secrets.JWT_REFRESH_SECRET }}"

          groq_api_key: "${{ secrets.GROQ_API_KEY }}"
          openai_api_key: "${{ secrets.OPENAI_API_KEY }}"

          cloudinary_cloud_name: "${{ secrets.CLOUDINARY_CLOUD_NAME }}"
          cloudinary_api_key: "${{ secrets.CLOUDINARY_API_KEY }}"
          cloudinary_api_secret: "${{ secrets.CLOUDINARY_API_SECRET }}"

          client_url: "http://${{ needs.terraform.outputs.ec2_ip }}"
          backend_url: "http://${{ needs.terraform.outputs.ec2_ip }}"

          google_client_id: "${{ secrets.GOOGLE_CLIENT_ID }}"
          google_client_secret: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          google_callback_url: "http://${{ needs.terraform.outputs.ec2_ip }}/api/auth/google/callback"

          adzuna_app_id: "${{ secrets.ADZUNA_APP_ID }}"
          adzuna_app_key: "${{ secrets.ADZUNA_APP_KEY }}"
          EOF

      # --------------------------------------------------------
      # Run Ansible
      # --------------------------------------------------------

      - name: Run Ansible deployment
        working-directory: devops
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          python -m ansible.cli.playbook \
            -i ansible/inventory/hosts.ini \
            ansible/playbooks/site.yml

      # --------------------------------------------------------
      # Application health check
      # --------------------------------------------------------

      - name: Wait for application
        run: |
          sleep 10

      - name: Health check
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            "http://${{ needs.terraform.outputs.ec2_ip }}/api/health"

      # --------------------------------------------------------
      # Always remove temporary SSH rule
      # --------------------------------------------------------

      - name: Remove runner SSH access
        if: always()
        run: |
          if [ -n "${{ steps.runner-ip.outputs.runner_ip }}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ needs.terraform.outputs.sg_id }}" \
              --protocol tcp \
              --port 22 \
              --cidr "${{ steps.runner-ip.outputs.runner_ip }}/32" \
              || true
          fi

      # --------------------------------------------------------
      # Remove local secrets
      # --------------------------------------------------------

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key.pem
          rm -f devops/ansible/inventory/hosts.ini
          rm -f devops/ansible/inventory/group_vars/all/ci.yml