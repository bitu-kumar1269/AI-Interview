# [defaults]
# inventory          = inventory/hosts.ini
# roles_path         = %(config_dir)s/roles
# retry_files_enabled = False
# interpreter_python = auto_silent
# timeout            = 30
# # Secrets (vault password) are supplied on the command line, never stored here.

# [ssh_connection]
# # accept-new: trust a host key the FIRST time, then refuse if it ever changes
# ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
# pipelining = True

[defaults]
inventory = inventory/hosts.ini
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True