---
# Whole workflow, in dependency order:
#   common     -> baseline OS (Ansible-owned)
#   puppet     -> install Puppet, apply manifests (Puppet-owned resources)
#   monitoring -> Nagios configuration (Ansible-owned) + validation
#   verify     -> prove everything works
- name: Baseline configuration
  ansible.builtin.import_playbook: common.yml

- name: Puppet installation and first enforcement run
  ansible.builtin.import_playbook: puppet.yml

- name: Nagios monitoring configuration
  ansible.builtin.import_playbook: monitoring.yml

- name: Verification
  ansible.builtin.import_playbook: verify.yml
