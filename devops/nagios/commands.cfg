# ─────────────────────────────────────────────────────────────────────
# Custom commands. Command names are prefixed so they never collide with
# those from /etc/nagios-plugins/config/*.cfg or /etc/nagios4/objects/.
# $USER1$ = /usr/lib/nagios/plugins (set in /etc/nagios4/resource.cfg)
# ─────────────────────────────────────────────────────────────────────

# Memory usage (% used) via the custom plugin in nagios/scripts/check_mem.sh
define command {
    command_name    check_mem_local
    command_line    $USER1$/check_mem -w $ARG1$ -c $ARG2$
}

# HTTPS response + response-time thresholds.
# ARG1=path  ARG2=warn seconds  ARG3=crit seconds  ARG4=timeout seconds
define command {
    command_name    check_app_https
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -S --sni -u $ARG1$ -w $ARG2$ -c $ARG3$ -t $ARG4$
}

# Same, but the response body must match "success": true (whitespace-tolerant
# regex, so JSON formatting differences cannot cause a false alarm). The
# existing backend /api/health endpoint returns {"success":true,"message":"OK",...}.
# Nagios runs lines containing quotes/brackets through /bin/sh, so the single
# quotes below protect the regex.
define command {
    command_name    check_app_health
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -S --sni -u $ARG1$ -w $ARG2$ -c $ARG3$ -t $ARG4$ -r '"success"[[:space:]]*:[[:space:]]*true'
}

# TLS certificate expiry. ARG1=warn days  ARG2=crit days  ARG3=timeout
define command {
    command_name    check_ssl_cert_days
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -S --sni -C $ARG1$,$ARG2$ -t $ARG3$
}

# Expect a specific HTTP status line on a local port (used to prove the
# Nagios UI is up AND password-protected: 401 Unauthorized without login).
# ARG1=port  ARG2=path  ARG3=expected status text
define command {
    command_name    check_http_status
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -u $ARG2$ -e $ARG3$
}

# Is the Nagios daemon itself alive and writing fresh status data?
define command {
    command_name    check_nagios_proc
    command_line    $USER1$/check_nagios -e 5 -F /var/lib/nagios4/status.dat -C /usr/sbin/nagios4
}
