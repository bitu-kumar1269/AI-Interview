# app_server.cfg
# Place this in /usr/local/nagios/etc/objects/ on your Nagios monitoring machine
# (this can be a separate small EC2 instance, or run locally in VirtualBox
# per the syllabus practicals)

define host {
    use             linux-server
    host_name       ai-interviewer-app-server
    alias           AI-Interviewer EC2 Instance
    address         REPLACE_WITH_TERRAFORM_OUTPUT_IP
}

# Check that the host itself is reachable
define service {
    use                     generic-service
    host_name               ai-interviewer-app-server
    service_description     PING
    check_command           check_ping!100.0,20%!500.0,60%
}

# Check that the frontend + API are responding over HTTP (via Nginx on port 80)
define service {
    use                     generic-service
    host_name               ai-interviewer-app-server
    service_description     HTTP - Frontend
    check_command           check_http
}

# Check the backend API health directly (adjust path if you add a /health route)
define service {
    use                     generic-service
    host_name               ai-interviewer-app-server
    service_description     HTTP - Backend API
    check_command           check_http!-p 5000 -u /api
}

# Check SSH is up
define service {
    use                     generic-service
    host_name               ai-interviewer-app-server
    service_description     SSH
    check_command           check_ssh
}

# Check CPU load via NRPE (requires the nrpe agent installed on the app server)
define service {
    use                     generic-service
    host_name               ai-interviewer-app-server
    service_description     CPU Load
    check_command           check_nrpe!check_load
}
