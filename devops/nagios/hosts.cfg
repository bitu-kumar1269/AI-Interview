# ─────────────────────────────────────────────────────────────────────
# Nagios hosts for the AI-Interviewer monitoring lab.
# Deployed by Ansible (roles/nagios) to /etc/nagios4/conf.d/.
# Uses templates shipped by Ubuntu's nagios4 package (linux-server, generic-host).
# ─────────────────────────────────────────────────────────────────────

# ── Templates (not real hosts) ──
define host {
    name                    ai-host
    use                     linux-server
    contact_groups          ai-admins
    notification_period     24x7
    max_check_attempts      3
    register                0
}

define host {
    name                    ai-app-host
    use                     generic-host
    check_period            24x7
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    check_command           check_tcp!443
    contact_groups          ai-admins
    notification_period     24x7
    notification_interval   60
    notification_options    d,u,r
    register                0
}

# ── The EC2 monitoring host itself ──
# Host liveness uses an SSH-port check (not ICMP ping) because ICMP is
# often blocked and sshd is a required service anyway.
define host {
    use                     ai-host
    host_name               monitor-host
    alias                   Nagios monitoring EC2 host (Ubuntu 24.04)
    address                 127.0.0.1
    check_command           check_tcp!22
    hostgroups              ai-infrastructure
}

# ── The deployed AI-Interviewer application (hosted on Render) ──
define host {
    use                     ai-app-host
    host_name               app-frontend
    alias                   AI-Interviewer frontend (React static site)
    address                 ai-interview-9qqm.onrender.com
    hostgroups              ai-interviewer-app
    notes                   Render static site - served over HTTPS (443)
}

define host {
    use                     ai-app-host
    host_name               app-backend
    alias                   AI-Interviewer backend API (Node/Express)
    address                 ai-interviewer-backend-opaw.onrender.com
    hostgroups              ai-interviewer-app
    notes                   Render web service - existing health endpoint is /api/health
}

# ── Host groups ──
define hostgroup {
    hostgroup_name          ai-infrastructure
    alias                   Infrastructure (monitoring host)
}

define hostgroup {
    hostgroup_name          ai-interviewer-app
    alias                   AI-Interviewer application endpoints
}
