# ─────────────────────────────────────────────────────────────────────
# Services, thresholds and intervals.
# Intervals: infra checks every 5 min (retry 1 min); app checks every
# 5 min (retry 2 min). A problem becomes a HARD state (and notifies)
# only after max_check_attempts consecutive failures.
# ─────────────────────────────────────────────────────────────────────

# ── Templates ──
define service {
    name                    ai-infra-service
    use                     local-service
    contact_groups          ai-admins
    notification_interval   60
    register                0
}

define service {
    name                    ai-app-service
    use                     generic-service
    check_interval          5
    retry_interval          2
    max_check_attempts      3
    contact_groups          ai-admins
    notification_interval   60
    register                0
}

# ── monitor-host: required infrastructure services ──
define service {
    use                     ai-infra-service
    host_name               monitor-host
    service_description     SSH Service
    check_command           check_ssh
}

# Load average thresholds assume 2 vCPUs (t3.micro/t3.small): warn/crit for
# the 1, 5 and 15 minute averages. Load average is the standard CPU-pressure metric.
define service {
    use                     ai-infra-service
    host_name               monitor-host
    service_description     CPU Load
    check_command           check_local_load!1.5,1.2,1.0!3.0,2.5,2.0
}

# Warning at 80% used, critical at 90% used (based on MemAvailable)
define service {
    use                     ai-infra-service
    host_name               monitor-host
    service_description     Memory Usage
    check_command           check_mem_local!80!90
}

# Warning when free space < 20%, critical when < 10%
define service {
    use                     ai-infra-service
    host_name               monitor-host
    service_description     Disk Usage /
    check_command           check_local_disk!20%!10%!/
}

define service {
    use                     ai-infra-service
    host_name               monitor-host
    service_description     Nagios Process
    check_command           check_nagios_proc
}

define service {
    use                     ai-infra-service
    host_name               monitor-host
    service_description     Nagios Web UI Port 80
    check_command           check_tcp!80
}

define service {
    use                     ai-infra-service
    host_name               monitor-host
    service_description     Nagios Web UI Auth Required
    check_command           check_http_status!80!/nagios4/!401
}

# ── app-frontend (Render static site) ──
# Render's free tier sleeps when idle and can take ~30s to wake, so the
# warn/crit/timeout values here (5s / 15s / 30s) are deliberately generous.
define service {
    use                     ai-app-service
    host_name               app-frontend
    service_description     Frontend HTTPS Response
    check_command           check_app_https!/!5!15!30
}

define service {
    use                     ai-app-service
    host_name               app-frontend
    service_description     Frontend TLS Certificate
    check_command           check_ssl_cert_days!14!7!30
    check_interval          720
    notification_interval   720
}

define service {
    use                     ai-app-service
    host_name               app-frontend
    service_description     Frontend Port 443
    check_command           check_tcp!443
}

# ── app-backend (Render web service) ──
define service {
    use                     ai-app-service
    host_name               app-backend
    service_description     Backend API Health
    check_command           check_app_health!/api/health!5!15!30
}

define service {
    use                     ai-app-service
    host_name               app-backend
    service_description     Backend TLS Certificate
    check_command           check_ssl_cert_days!14!7!30
    check_interval          720
    notification_interval   720
}

define service {
    use                     ai-app-service
    host_name               app-backend
    service_description     Backend Port 443
    check_command           check_tcp!443
}
